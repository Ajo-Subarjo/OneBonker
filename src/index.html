<canvas id="cv"></canvas>
<style>body{margin:0}</style>
<script>
const c = document.getElementById('cv');
const x = c.getContext('2d');
const A = new AudioContext;

const s = (a, b, t, y = 'square', v = .5) => {
  const o = A.createOscillator();
  const g = A.createGain();
  const n = A.currentTime;
  o.type = y;
  o.frequency.setValueAtTime(a, n);
  o.frequency.exponentialRampToValueAtTime(b, n + t);
  g.gain.setValueAtTime(v, n);
  g.gain.exponentialRampToValueAtTime(.001, n + t);
  o.connect(g).connect(A.destination);
  o.start();
  o.stop(n + t);
};

let run = false, skor = 0, timeleft = 30, lockuntil = 0;
let message = 'TAP TO START', lastFrameTime = 0, noteIndex = 0;
const MOLE_COUNT = 9;

const moles = Array.from({ length: MOLE_COUNT }, () => ({
  isUp: false,
  progress: 0,
  y: 0
}));

let width, height, scale;
function resize() {
  width = c.width = window.innerWidth;
  height = c.height = window.innerHeight;
  scale = Math.min(width, height * .8) / 3.4;
}
resize();
window.onresize = resize;

function getHolePos(i) {
  const col = i % 3;
  const row = Math.floor(i / 3);
  return {
    x: width / 2 + (col - 1) * scale * 1.1,
    y: height / 2 + (row - 1) * scale * 1.1 + scale * .4
  };
}

setInterval(() => {
  if (!run) return;
  const m = moles[Math.floor(Math.random() * moles.length)];
  if (!m.isUp) {
    m.isUp = true;
    m.progress = 0;
    s(200, 800, .3, 'sawtooth');
  }
}, 800);


setInterval(() => {
  if (!run) return;
  if (--timeleft <= 0) {
    run = false;
    lockuntil = Date.now() + 3000;
    message = 'FINISH!!! SKOR:' + skor;
  }
}, 1000);

const ARP = [0, 4, 7, 12, 7, 4];
setInterval(() => {
  if (!run) return;
  const f = 220 * 2 ** (ARP[noteIndex++ % ARP.length] / 12);
  s(f, f, .2, 'square', .3);
}, 250);

window.onpointerdown = e => {
  if (!run) {
    if (Date.now() < lockuntil) return;
    run = true;
    skor = 0;
    timeleft = 30;
  }
  A.resume();

  let hit = false;
  moles.forEach((m, i) => {
    if (hit || !m.isUp) return;
    const hole = getHolePos(i);
    if (Math.hypot(e.clientX - hole.x, e.clientY - (m.y + scale * .35)) < scale * .45) {
      hit = true;
      m.isUp = false;
      skor++;
      s(500, 50, .15, 'sawtooth');
    }
  });
  if (!hit) s(150, 100, .3);
};

function ball(px,py,rx,ry,fill,line, rot = 0) {
  x.beginPath();
  x.ellipse(px,py,rx,ry,rot,0,Math.PI*2);
  x.fillStyle = fill;
  x.fill();
  if (line) {
    x.strokeStyle = '#000';
    x.lineWidth = 3;
    x.stroke();
  }
}

function dmole(px,py,r) {
  const cy = py + 3*.35
  ball(px + r * .30, cy + r * -0.25, r * .12, r * .2, '#3b2f10', true, 0.3)
  ball(px + r * -.30, cy + r * -0.25, r * .12, r * .2, '#3b2f10', true, -0.3)
  ball(px, cy + r * .3, r * .38, r * .55, '#8b5a2b', true);
  ball(px - r * .14, cy + r * .05, r * .06, r * .09, '#000', true);
  ball(px + r * .14, cy + r * .05, r * .06, r * .09, '#000', true);
  ball(px, cy + r*.18, r*.08, r*.06, '#3b2110', true,);
}

function draw(ts) {
  requestAnimationFrame(draw);

  const dt = Math.min((ts - lastFrameTime) / 1000, .1);
  lastFrameTime = ts;

  x.fillStyle = '#ffffaa';
  x.fillRect(0, 0, width, height);

  x.textAlign = 'center';
  x.fillStyle = '#000';
  x.font = 'bold ' + scale * .3 + 'px monospace';
  x.fillText(
    run ? `SKOR:${skor}  TIME:${timeleft}` : message,
    width / 2,
    scale * .4
  );

  x.font = 'bold ' + scale * .5 + 'px monospace';

  moles.forEach((m, i) => {
    const hole = getHolePos(i);

    if (m.isUp) {
      m.progress += dt;
      if (m.progress >= 1) m.isUp = false;
    }
    m.y = hole.y - Math.sin(m.progress * Math.PI) * scale * .6;

    x.beginPath();
    x.ellipse(hole.x,hole.y,scale*.5,scale*.2,0,Math.PI,Math.PI*2);
    x.fillStyle = '#ffcc33';
    x.fill();
    x.strokeStyle = '#000';
    x.lineWidth = 3;
    x.stroke()

    if (m.isUp) {
      x.save();
      x.beginPath();
      x.rect(hole.x - scale, hole.y - scale * 2, scale * 2, scale * 2);
      x.clip();
      dmole(hole.x,m.y, scale)
      x.restore();
    }

    x.beginPath();
    x.ellipse(hole.x,hole.y,scale*.5,scale*.2,0,0,Math.PI);
    x.fillStyle = '#ffcc33';
    x.fill();
    x.strokeStyle = '#000';
    x.lineWidth = 3;
    x.stroke()
  });
}
requestAnimationFrame(draw);
</script>
